<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHON! Host</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="art.js"></script>
<script src="sfx.js"></script>
<script src="common.js"></script>
<script>
let S = null, net, lastEvt = 0, lastRollSeq = -1, lastTurnKey = '', soundOn = true;
const app = document.getElementById('app');
const saved = (() => { try { return JSON.parse(sessionStorage.getItem('ahon_host') || 'null'); } catch { return null; } })();
const shown = {};          // animated (displayed) board position per player
let moving = false, tickTimer = null;

net = connectWS({
  open() { saved ? net.send({ t: 'host_resume', code: saved.code, hostKey: saved.hostKey }) : net.send({ t: 'host_create' }); },
  message(m) {
    if (m.t === 'hosted') sessionStorage.setItem('ahon_host', JSON.stringify({ code: m.code, hostKey: m.hostKey }));
    else if (m.t === 'host_invalid') { sessionStorage.removeItem('ahon_host'); location.reload(); }
    else if (m.t === 'state') { const prev = S; S = m; onState(prev); }
  }
});
const send = o => net.send(o);
document.addEventListener('click', () => SFX.unlock(), { once: true });

function toggleSound() { soundOn = !soundOn; SFX.setEnabled(soundOn); SFX.unlock(); render(); }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }

/* ---------- state change + effects ---------- */
function onState(prev) {
  // sound / particle events
  if (S.evt && S.evt.n !== lastEvt) {
    const first = lastEvt === 0 && !prev;
    lastEvt = S.evt.n;
    if (!first) playEvent(S.evt);
  }
  // timer needs a clock offset between server and host
  S._skew = (S.now || Date.now()) - Date.now();
  // turn chime
  const key = S.turn ? S.turn.pid + '|' + S.round : '';
  if (key && key !== lastTurnKey && S.state === 'playing') SFX.turn();
  lastTurnKey = key;
  render();
  animateTokens();
}

function playEvent(e) {
  const pos = tokenScreenPos(e.pid);
  switch (e.type) {
    case 'join': SFX.join(); break;
    case 'payday': SFX.payday(); if (e.amount > 0) FX.coins(pos.x, pos.y); break;
    case 'buy': SFX.buy(); FX.coins(pos.x, pos.y); break;
    case 'sell': SFX.sell(); FX.coins(pos.x, pos.y); break;
    case 'doodad': case 'baby': case 'downsized': SFX.bad(); FX.smoke(pos.x, pos.y); break;
    case 'card': SFX.card(); break;
    case 'escape': SFX.win(); FX.confetti(); break;
    case 'start': SFX.win(); break;
    case 'end': SFX.win(); FX.confetti(); break;
    case 'donate': SFX.coin(); break;
    case 'loan': case 'payoff': SFX.coin(); break;
  }
}

/* ---------- board geometry ---------- */
function boardPositions() {
  const pos = [];
  for (let c = 0; c < 7; c++) pos.push([0, c]);
  for (let r = 1; r < 7; r++) pos.push([r, 6]);
  for (let c = 5; c >= 0; c--) pos.push([6, c]);
  for (let r = 5; r >= 1; r--) pos.push([r, 0]);
  return pos;
}
const POS = boardPositions();

function tokenXY(idx, slot, total) {
  const [r, c] = POS[idx];
  const off = total > 1 ? (slot - (total - 1) / 2) * 3.2 : 0;
  return { left: (c + .5) * 100 / 7 + off, top: (r + .5) * 100 / 7 + (total > 1 ? (slot % 2 ? 1.6 : -1.6) : 0) };
}
function tokenScreenPos(pid) {
  const el = pid && document.querySelector(`.token[data-id="${pid}"]`);
  if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
  const b = el.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 };
}

function animateTokens() {
  if (!S || S.state !== 'playing' || moving) return;
  const tgt = {}; S.players.forEach(p => tgt[p.id] = p.pos);
  const n = S.board.length;
  const todo = S.players.filter(p => shown[p.id] != null && shown[p.id] !== p.pos);
  S.players.forEach(p => { if (shown[p.id] == null) shown[p.id] = p.pos; });
  if (!todo.length) return layoutTokens();
  moving = true;
  (function step() {
    let any = false;
    todo.forEach(p => { if (shown[p.id] !== tgt[p.id]) { shown[p.id] = (shown[p.id] + 1) % n; any = true; const el = document.querySelector(`.token[data-id="${p.id}"]`); el && (el.classList.remove('hop'), void el.offsetWidth, el.classList.add('hop')); } });
    layoutTokens(); if (any) SFX.step();
    if (any) tickTimer = setTimeout(step, 270); else { moving = false; render(); }
  })();
}

function layoutTokens() {
  const byCell = {};
  S.players.forEach(p => { const i = shown[p.id] != null ? shown[p.id] : p.pos; (byCell[i] = byCell[i] || []).push(p); });
  Object.entries(byCell).forEach(([i, list]) => list.forEach((p, slot) => {
    const el = document.querySelector(`.token[data-id="${p.id}"]`); if (!el) return;
    const xy = tokenXY(+i, slot, list.length); el.style.left = xy.left + '%'; el.style.top = xy.top + '%';
  }));
}

/* ---------- screens ---------- */
function render() {
  if (!S) return;
  if (S.state === 'lobby') return renderLobby();
  if (S.state === 'ended') return renderEnded();
  renderGame();
}
const joinUrl = () => `${location.origin}/play.html?room=${S.code}`;

function topbar(extra) {
  return `<div class="topbar"><div class="left">${ART.logo(40)}</div>
    <div class="right">${extra || ''}
      <button class="ghost" onclick="toggleSound()" title="Sound">${ART.ui(soundOn ? 'volume' : 'mute', 20)}</button>
      <button class="ghost" onclick="toggleFull()" title="Fullscreen">${ART.ui('expand', 20)}</button></div></div>`;
}

let lobbyKey = '';
function renderLobby() {
  const key = JSON.stringify([S.code, S.players.map(p => [p.id, p.name, p.avatar, p.connected]), S.settings]);
  if (key === lobbyKey) return; lobbyKey = key;
  const focus = document.activeElement && document.activeElement.id;
  const timers = [[0, 'Off'], [30, '30 s'], [45, '45 s'], [60, '60 s'], [90, '90 s'], [120, '2 min']];
  app.innerHTML = topbar() + `<div class="lobby">
    <div>
      <h1 style="font-size:clamp(36px,4.4vw,62px);line-height:1.02;margin-bottom:12px">Climb out of the<br><span style="background:linear-gradient(transparent 62%,var(--mustard) 62%)">paycheck race.</span></h1>
      <p style="font-size:1.12rem;max-width:560px;line-height:1.5;color:var(--ink2)">Build assets, dodge doodads and grow your passive income until it covers your expenses. First to freedom wins.</p>
      <div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:22px">
        <div><div class="mute small" style="font-weight:800;letter-spacing:.14em;margin-bottom:6px">ROOM CODE</div><div class="code">${esc(S.code)}</div></div>
        <div class="qrbox"><img alt="Scan to join" src="/qr?text=${encodeURIComponent(joinUrl())}"></div>
      </div>
      <p class="mute" style="margin-top:14px">Scan the QR or go to <b style="color:var(--ink)">${esc(location.host)}/play.html</b> on your phone and enter the code.</p>
      <div class="steps">
        <div class="step"><i>1</i><span>Everyone joins on their phone and picks a character.</span></div>
        <div class="step"><i>2</i><span>Roll, decide, learn. Your phone is your wallet and your controller.</span></div>
        <div class="step"><i>3</i><span>Discuss the debrief together at the end.</span></div>
      </div>
    </div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2>Players <span class="mute">${S.players.length}/8</span></h2><button class="sec" onclick="send({t:'add_bot'})">${ART.ui('bot', 18)} Add bot</button></div>
      <div class="joinlist">${S.players.length ? S.players.map(p => `<div class="joiner">
        <button class="sec x" title="Remove" onclick="send({t:'remove_player',pid:'${p.id}'})">${ART.ui('close', 14)}</button>${ART.avatar(p.avatar, 68)}<b>${esc(p.name)}</b>
        <span class="mute small">${p.bot ? 'Bot' : p.connected ? 'Ready' : 'Offline'}</span></div>`).join('') : '<p class="mute" style="grid-column:1/-1">Waiting for players to join…</p>'}</div>
      <div class="settings">
        <label>Game length
          <select id="rounds" onchange="send({t:'set_rounds',value:this.value})">${[10, 15, 20, 25, 30, 40].map(v => `<option value="${v}" ${S.settings.maxRounds === v ? 'selected' : ''}>${v} rounds (about ${Math.round(v * 1.8)} min)</option>`).join('')}<option value="0" ${S.settings.maxRounds === 0 ? 'selected' : ''}>Unlimited (you end the game)</option></select></label>
        <label>Turn timer
          <select id="timer" onchange="send({t:'set_timer',value:this.value})">${timers.map(([v, l]) => `<option value="${v}" ${S.settings.timer === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <button class="good big-btn" style="margin-top:18px" ${S.players.length ? '' : 'disabled'} onclick="SFX.unlock();send({t:'start'})">${ART.ui('play', 18)} Start game</button>
      <p class="mute small center-t" style="margin-top:10px">Works best with 3 to 6 players. Add bots to test solo.</p>
    </div></div>`;
  if (focus) { const el = document.getElementById(focus); el && el.focus(); }
}

function centerStage() {
  const t = S.turn;
  const cur = t && S.players.find(p => p.id === t.pid);
  if (!t || !cur) return '<div class="wait">…</div>';
  const pend = t.pending, roll = t.lastRoll;
  const rolled = roll && roll.n !== lastRollSeq;
  if (roll) lastRollSeq = roll.n;
  const dice = roll && roll.pid === cur.id ? `<div class="dice">${roll.dice.map(d => dieHTML(d, rolled)).join('')}</div>` : '';
  let body = '';
  if (t.phase === 'roll') body = `<div class="wait"><div class="die-wrap">${dice}</div>Waiting for <b style="color:${cur.color}">${esc(cur.name)}</b> to roll…</div>`;
  else if (pend) {
    if (pend.kind === 'opp_choice') body = `<div class="wait"><div class="gc-art" style="--tc:#ffd24d">${ART.icon('opp', 110)}</div><span class="head">Opportunity</span>${esc(cur.name)} is choosing a small or big deal…</div>`;
    else if (pend.kind === 'deal') body = dealCardHTML(pend.card, pend.size);
    else if (pend.kind === 'market') body = marketCardHTML(pend, false);
    else if (pend.kind === 'charity') body = `<div class="wait"><div class="gc-art" style="--tc:#a78bfa">${ART.icon('charity', 100)}</div><span class="head">Give Back</span>Will ${esc(cur.name)} donate ${peso(pend.amount)} for bonus rolls?</div>`;
    else if (pend.kind === 'result') body = resultCardHTML(pend);
  }
  return `<div class="who">${ART.avatar(cur.avatar, 54)}<div><b>${esc(cur.name)}</b><span class="mute">${esc(cur.prof)} • ${peso(cur.cash)} cash</span></div><div style="margin-left:auto">${dice && t.phase !== 'roll' ? dice : ''}</div></div><div class="body">${body}</div>`;
}

let gameKey = '';
function renderGame() {
  const t = S.turn;
  const cells = S.board.map((type, i) => {
    const sp = SPACES[type], [r, c] = POS[i];
    const cur = t && S.players.find(p => p.id === t.pid && p.pos === i);
    return `<div class="cell ${cur ? 'cur' : ''}" style="grid-row:${r + 1};grid-column:${c + 1};--c1:${sp.c1};--c2:${sp.c2}">${i === 0 ? '<span class="start">START</span>' : ''}${ART.icon(type)}<span class="nm">${sp.n}</span></div>`;
  }).join('');
  const toks = S.players.map(p => `<div class="token ${t && t.pid === p.id ? 'cur' : ''}" data-id="${p.id}" style="left:${(POS[p.pos][1] + .5) * 100 / 7}%;top:${(POS[p.pos][0] + .5) * 100 / 7}%">${ART.avatar(p.avatar)}</div>`).join('');
  const ranked = rankPlayers(S.players);
  const plist = ranked.map(p => {
    const c = p.calc, pct = Math.min(100, Math.round(c.coverage * 100));
    return `<div class="pc ${t && t.pid === p.id ? 'cur' : ''}">${ART.avatar(p.avatar, 48)}<div>
      <div class="top"><b>${esc(p.name)}${p.free ? '<span class="gold-t">' + ART.ui('trophy', 16) + '</span>' : ''}</b><span class="mute small">${esc(p.prof)}${!p.connected && !p.bot ? ' • offline' : ''}</span></div>
      <div class="bar" style="margin-top:5px"><i style="width:${pct}%"></i></div>
      <div class="nums"><span>Freedom <b>${Math.round(c.coverage * 100)}%</b></span><span>Cash <b>${compact(p.cash)}</b></span><span>Passive <b class="good-t">${compact(c.passive)}</b></span><span>Assets <b>${p.assets.length}</b></span></div></div></div>`;
  }).join('');
  const logs = S.log.slice(-14).reverse().map(l => `<div class="logline">${esc(l.msg)}</div>`).join('');
  const old = document.querySelector('.logbox'), scroll = old ? old.scrollTop : 0;
  const stageEl = document.querySelector('.stage');
  const stageHTML = centerStage();
  const first = !document.querySelector('.board');
  if (first) {
    app.innerHTML = topbar(`<span class="pill" id="rnd"></span><span class="pill timerpill" id="timerpill" style="display:none"></span>
      <button class="sec" onclick="send({t:'skip_turn'})">Skip turn</button>
      <button class="sec" onclick="if(confirm('End the game and show the debrief?'))send({t:'end_game'})">End game</button>`) + `<div class="host">
      <div class="boardwrap"><div class="board" id="board"></div></div>
      <div class="side"><div id="rejoin"></div><div class="plist" id="plist"></div><div class="logbox" id="logbox"></div></div></div>`;
  }
  const board = document.getElementById('board');
  const sig = stageHTML;
  if (first || board.dataset.cells !== S.board.join()) { board.dataset.cells = S.board.join(); board.innerHTML = cells + `<div class="stage" id="stage"></div><div class="tokens" id="tokens"></div>`; gameKey = ''; }
  document.getElementById('tokens').innerHTML = toks;
  // refresh current cell highlight without rebuilding stage
  [...board.querySelectorAll('.cell')].forEach((el, i) => el.classList.toggle('cur', !!(t && S.players.find(p => p.id === t.pid && p.pos === i))));
  const stage = document.getElementById('stage');
  if (gameKey !== sig) { stage.innerHTML = sig; gameKey = sig; }
  document.getElementById('plist').innerHTML = plist;
  const lb = document.getElementById('logbox'); lb.innerHTML = logs; lb.scrollTop = scroll;
  document.getElementById('rnd').textContent = (S.settings.maxRounds ? `Round ${Math.min(S.round, S.settings.maxRounds)} / ${S.settings.maxRounds}` : `Round ${S.round}`);
  layoutTokens();
  updateRejoin();
  startClock();
}

function updateRejoin() {
  const el = document.getElementById('rejoin'); if (!el) return;
  const hidden = localStorage.getItem('ahon_qr_hidden') === '1';
  const key = S.code + '|' + hidden; if (el.dataset.k === key) return; el.dataset.k = key;
  el.innerHTML = hidden
    ? `<div class="rejoin slim"><span>${ART.ui('users', 16)} Rejoin QR hidden</span><button class="sec" onclick="toggleRejoin()">Show</button></div>`
    : `<div class="rejoin"><div class="rj-head"><b>Rejoin QR</b><button class="sec" onclick="toggleRejoin()">Hide</button></div><div class="rj-body"><div class="qrbox sm"><img alt="Rejoin QR" src="/qr?text=${encodeURIComponent(joinUrl())}"></div><div><div class="mute small">Room code</div><div class="rj-code">${esc(S.code)}</div><p class="mute small">Left by accident? Scan this, then tap your name under Rejoin.</p></div></div></div>`;
}
function toggleRejoin() { localStorage.setItem('ahon_qr_hidden', localStorage.getItem('ahon_qr_hidden') === '1' ? '0' : '1'); updateRejoin(); }

function startClock() {
  clearInterval(window._clock);
  const pill = document.getElementById('timerpill');
  if (!pill) return;
  const dl = S.turn && S.turn.deadline;
  if (!dl) { pill.style.display = 'none'; return; }
  pill.style.display = 'inline-flex';
  const tick = () => {
    const left = Math.max(0, Math.ceil((dl - (Date.now() + (S._skew || 0))) / 1000));
    pill.innerHTML = ART.ui('timer', 16) + ' ' + left + 's'; pill.classList.toggle('urgent', left <= 10);
    if (left <= 5 && left > 0) SFX.tick();
  };
  tick(); window._clock = setInterval(tick, 1000);
}

/* ---------- debrief ---------- */
function lineChart() {
  const W = 880, H = 260, pad = 38, h = S.history;
  if (h.length < 2) return '';
  const maxY = Math.max(100, ...h.flatMap(x => Object.values(x.data).map(d => d.cov)));
  const X = i => pad + i * (W - pad * 2) / (h.length - 1), Y = v => H - pad - v * (H - pad * 2) / maxY;
  const grid = [0, 25, 50, 75, 100].filter(v => v <= maxY).map(v => `<line x1="${pad}" x2="${W - pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(29,36,51,.14)"/><text x="${pad - 6}" y="${Y(v) + 4}" fill="#6b7488" font-size="11" text-anchor="end">${v}%</text>`).join('');
  const goal = `<line x1="${pad}" x2="${W - pad}" y1="${Y(100)}" y2="${Y(100)}" stroke="#14805f" stroke-width="2" stroke-dasharray="6 6"/><text x="${W - pad}" y="${Y(100) - 6}" fill="#14805f" font-size="12" text-anchor="end" font-weight="700">100% = FREE</text>`;
  const lines = S.players.map(p => `<polyline fill="none" stroke="${p.color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${h.map((x, i) => x.data[p.id] ? X(i) + ',' + Y(x.data[p.id].cov) : null).filter(Boolean).join(' ')}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}${goal}${lines}<text x="${pad}" y="14" fill="#6b7488" font-size="12">Passive income ÷ expenses, by round</text></svg>`;
}

function downloadCSV() {
  const rows = [['Rank', 'Player', 'Profession', 'Freedom %', 'Passive/mo', 'Expenses/mo', 'Net worth', 'Assets bought', 'Doodads spent', 'Borrowed', 'Donated', 'Escaped round']];
  rankPlayers(S.players).forEach((p, i) => { const c = p.calc; rows.push([i + 1, p.name, p.prof, Math.round(c.coverage * 100), c.passive, c.expenses, c.netWorth, p.stats.deals, p.stats.doodads, p.stats.loans, p.stats.donated, p.freeRound || '']); });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `ahon-results-${S.code}.csv`; a.click();
}

let endedKey = '';
function renderEnded() {
  const rank = rankPlayers(S.players);
  const key = JSON.stringify([S.code, rank.map(p => [p.id, p.calc.coverage])]);
  if (key === endedKey && document.querySelector('.debrief')) return; endedKey = key; gameKey = '';
  const rows = rank.map((p, i) => {
    const c = p.calc;
    return `<tr><td>${i + 1}</td><td><div class="pn">${ART.avatar(p.avatar, 36)}<div><b>${esc(p.name)}${p.free ? '<span class="gold-t">' + ART.ui('trophy', 16) + '</span>' : ''}</b><div class="mute small">${esc(p.prof)}</div></div></div></td>
      <td style="min-width:150px"><div class="bar"><i style="width:${Math.min(100, Math.round(c.coverage * 100))}%"></i></div><span class="small">${Math.round(c.coverage * 100)}%</span></td>
      <td>${peso(c.passive)}</td><td>${peso(c.expenses)}</td><td>${peso(c.netWorth)}</td><td>${p.stats.deals}</td><td>${peso(p.stats.doodads)}</td><td>${peso(p.stats.loans)}</td></tr>`;
  }).join('');
  const pod = (p, cls, n) => p ? `<div class="pod ${cls}">${ART.avatar(p.avatar)}<b>${esc(p.name)}</b><span class="mute small">${Math.round(p.calc.coverage * 100)}% free</span><div class="block">${n}</div></div>` : '';
  const totDoodad = S.players.reduce((s, p) => s + p.stats.doodads, 0);
  const totPassive = S.players.reduce((s, p) => s + p.calc.passive, 0);
  const reason = { rounds: 'All rounds played.', allfree: 'Everyone escaped!', host: 'Ended by the host.', stuck: '' }[S.endReason] || '';
  app.innerHTML = topbar(`<button class="sec" onclick="downloadCSV()">${ART.ui('download', 18)} Results (CSV)</button><button onclick="send({t:'new_game'})">Play again</button>`) + `<div class="debrief">
    <h1 style="font-size:2.4rem">Debrief <span class="mute" style="font-size:1rem;font-family:var(--body)">${esc(reason)}</span></h1>
    <div class="podium">${pod(rank[1], 'second', 2)}${pod(rank[0], 'first', 1)}${pod(rank[2], 'third', 3)}</div>
    <table class="res"><thead><tr><th>#</th><th>Player</th><th>Freedom</th><th>Passive / mo</th><th>Expenses / mo</th><th>Net worth</th><th>Assets</th><th>Doodads</th><th>Borrowed</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="card" style="margin-top:16px"><h3>Journey of each player</h3>${lineChart()}</div>
    <div class="cols2">
      <div class="card"><h3>Discussion questions</h3><ol class="q">
        <li>What was the first asset you bought, and why? Was it the right one?</li>
        <li>Which doodad hurt the most? What is its real-life equivalent?</li>
        <li>When did you borrow? Was the money used for an asset or to cover spending?</li>
        <li>What would you do differently next time, and what will you do this month in real life?</li>
        <li>How can you tell if a "deal" is worth it, or too good to be true?</li></ol></div>
      <div class="card"><h3>Key takeaways</h3>
        <div class="lesson"><b>Assets vs liabilities</b>Assets put money in your pocket every month. Liabilities take it out.</div>
        <div class="lesson"><b>The group's doodad bill</b>${peso(totDoodad)} went to doodads, compared with ${peso(totPassive)} a month of passive income built. What could that spending have become?</div>
        <div class="lesson"><b>Emergency fund</b>3 to 6 months of expenses in cash is what protects you from a layoff or surprise bill.</div>
        <div class="lesson"><b>Game math is not real life</b>Returns here are higher than reality and every investment carries risk. Speak to a licensed financial adviser before investing.</div></div></div></div>`;
}
</script>
</body>
</html>
